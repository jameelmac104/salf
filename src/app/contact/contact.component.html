
<!-- contact.component.html -->
<div class="main-content my-5">
  <div class="row justify-content-center p-5">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0 rounded-3">
        <div class="card-body p-4">
          <h2 class="mb-4 text-center">Contact Us</h2>
          <form (ngSubmit)="sendMail()" #contactForm="ngForm">
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  [(ngModel)]="contact.name"
                  required
                  maxlength="80"
                  placeholder="Jane Doe"
                />
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Your Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  [(ngModel)]="contact.email"
                  required
                  maxlength="120"
                  placeholder="you@example.com"
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input
                type="text"
                class="form-control"
                id="subject"
                name="subject"
                [(ngModel)]="contact.subject"
                required
                maxlength="120"
                placeholder="How can we help?"
              />
            </div>

            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea
                class="form-control"
                id="message"
                name="message"
                [(ngModel)]="contact.message"
                required
                rows="5"
                placeholder="Write your message..."
              ></textarea>
              <small class="text-muted">Submitting opens your email app with everything filled in.</small>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                Open Email to Send
              </button>
            </div>
          </form>

          <noscript>
            <p class="text-muted mt-3">
              JavaScript is disabled. You can email us directly:
              <a href="mailto:johnpaul@southasialawfirm.com">johnpaul{{'@'}}southasialawfirm.com</a>.
            </p>
          </noscript>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer [contactPage]="true"></app-footer>
